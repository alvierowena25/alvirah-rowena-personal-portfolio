<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alvirah Rowena | Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #f4efe9;
      --card-white: rgba(255, 255, 255, 0.78);
      --border-taupe: #e4dcd3;
      --brown-primary: #8b5a2b;
      --brown-dark: #2c1d11;
      --brown-light: rgba(250, 246, 240, 0.85);
      --text-main: #2c221e;
      --text-muted: #75665e;
      --accent-glow: rgba(139, 90, 43, 0.14);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-main);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .paper-grain {
      position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .bg-video-container {
      position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; opacity: 0.55;
    }
    .bg-video-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .main-wrapper {
      position: relative; z-index: 10; width: 94%; max-width: 1400px; height: 92vh;
      background: var(--card-white);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid var(--border-taupe);
      border-radius: 28px; box-shadow: 0 20px 50px rgba(44, 34, 30, 0.06);
      display: flex; flex-direction: column; justify-content: space-between;
      overflow: hidden; margin: auto;
      opacity: 0;
      transform: translateY(18px) scale(0.985);
      animation:
        wrapperReveal 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards,
        wrapperShadowBreath 6s ease-in-out 0.9s infinite;
    }

    @keyframes wrapperReveal {
      0% { opacity: 0; transform: translateY(18px) scale(0.985); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes wrapperShadowBreath {
      0%, 100% {
        box-shadow: 0 20px 50px rgba(44, 34, 30, 0.06);
        border-color: var(--border-taupe);
      }
      50% {
        box-shadow: 0 30px 75px var(--accent-glow);
        border-color: #d6c9ba;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .main-wrapper,
      .chibi-companion {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }

    header.logo-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 45px; border-bottom: 1px solid var(--border-taupe);
      background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(12px); flex-shrink: 0;
      gap: 12px; z-index: 20;
    }
    .logo-text { font-family: 'JetBrains Mono', monospace; font-size: 1rem; font-weight: 800; color: var(--brown-primary); letter-spacing: 1.5px; }
    nav { display: flex; gap: 6px; background: var(--brown-light); padding: 5px; border-radius: 30px; border: 1.5px solid var(--border-taupe); flex-wrap: wrap; }
    nav a { text-decoration: none; color: var(--text-muted); font-size: 0.82rem; font-weight: 600; padding: 7px 18px; border-radius: 20px; transition: all 0.25s ease; }
    nav a:hover { color: var(--brown-dark); background: #ffffff; }
    nav a.active { background: var(--brown-dark); color: #ffffff; box-shadow: 0 4px 12px rgba(44,29,17,0.15); }

    .page-content {
      padding: 30px 45px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 26px;
      scrollbar-width: thin; scrollbar-color: var(--border-taupe) transparent;
    }

    .page-header-flex {
      display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid var(--border-taupe); padding-bottom: 12px; gap: 12px;
    }
    .page-title {
      font-family: 'Instrument Serif', serif; font-size: 2.8rem; font-weight: 400; color: var(--brown-dark); line-height: 1;
    }
    .page-subtitle {
      font-family: 'JetBrains Mono', monospace; font-size: 0.76rem; color: var(--text-muted); margin-top: 6px;
    }

    .group-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--brown-primary);
      margin-top: 6px;
    }

    .topics-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 26px 38px;
      width: 100%;
    }

    .section-block {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      width: fit-content;
      max-width: 100%;
    }

    .section-heading {
      font-family: 'Instrument Serif', serif;
      font-size: 1.65rem;
      color: var(--brown-dark);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }
    .section-heading::after {
      content: "";
      width: 48px;
      height: 1px;
      background: var(--border-taupe);
    }

    .image-grid-container {
      display: inline-flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      width: fit-content;
      max-width: 100%;
      background: var(--brown-light);
      border: 1.5px solid var(--border-taupe);
      border-radius: 20px;
      padding: 18px;
    }

    .gallery-item {
      position: relative;
      width: 265px;
      height: 210px;
      border-radius: 12px;
      overflow: hidden;
      background: #eae2d8;
      border: 1.5px solid var(--brown-dark);
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(59, 38, 24, 0.08);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .gallery-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(139, 90, 43, 0.14);
      border-color: var(--brown-primary);
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .gallery-item img:hover {
      transform: scale(1.04);
    }

    #imageModal {
      display: none;
      position: fixed; inset: 0;
      background: rgba(44, 29, 17, 0.85);
      z-index: 1000;
      justify-content: center; align-items: center;
      backdrop-filter: blur(8px);
      padding: 16px;
    }
    #imageModal img {
      max-width: 88vw; max-height: 88vh;
      border-radius: 14px;
      border: 2px solid var(--border-taupe);
      box-shadow: 0 30px 60px rgba(0,0,0,0.4);
    }

    .chibi-companion {
      position: fixed;
      right: 28px;
      bottom: 64px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      animation: chibiFloat 3.4s ease-in-out infinite;
    }

    @keyframes chibiFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }

    .chibi-bubble {
      background: #ffffff;
      color: var(--brown-dark);
      border: 1.5px solid var(--border-taupe);
      box-shadow: 0 8px 20px rgba(59, 38, 24, 0.1);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.64rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .chibi-companion:hover .chibi-bubble {
      transform: translateY(-2px);
      border-color: var(--brown-primary);
    }

    .chibi-avatar-shell {
      width: 68px;
      height: 68px;
      border-radius: 22px;
      background: #ffffff;
      border: 1.5px solid var(--border-taupe);
      box-shadow: 0 12px 26px rgba(59, 38, 24, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .chibi-companion:hover .chibi-avatar-shell {
      transform: scale(1.07) rotate(-2deg);
      border-color: var(--brown-primary);
      box-shadow: 0 14px 30px var(--accent-glow);
    }

    .chibi-companion:active .chibi-avatar-shell {
      transform: scale(0.95);
    }

    .chibi-svg {
      width: 56px;
      height: 56px;
      overflow: visible;
    }

    .chibi-eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: chibiBlink 4.2s infinite;
    }

    @keyframes chibiBlink {
      0%, 94%, 100% { transform: scaleY(1); }
      97% { transform: scaleY(0.12); }
    }

    footer.footer-area {
      padding: 16px 45px; border-top: 1px solid var(--border-taupe); background: rgba(255, 255, 255, 0.88);
      display: flex; justify-content: space-between; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--text-muted); flex-shrink: 0; gap: 10px;
    }
    .footer-links { display: flex; gap: 15px; }
    .footer-links a { color: var(--brown-dark); text-decoration: none; font-weight: 600; transition: color 0.2s; }
    .footer-links a:hover { color: var(--brown-primary); }

    /* Tablet Breakpoint (641px to 1024px) */
    @media (max-width: 1024px) {
      body {
        width: 100%;
        height: auto;
        min-height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
        display: block;
        padding: 14px;
      }
      .main-wrapper {
        width: 100%;
        height: auto;
        min-height: calc(100vh - 28px);
        border-radius: 26px;
        overflow: visible;
      }
      header.logo-nav {
        flex-direction: column;
        gap: 10px;
        padding: 16px 24px;
      }
      .page-content {
        padding: 22px 24px 80px;
        overflow: visible;
      }
      .gallery-item {
        width: 210px;
        height: 170px;
      }
      .chibi-companion {
        right: 18px;
        bottom: 18px;
        transform: scale(0.9);
        transform-origin: bottom right;
      }
    }

    /* Phone Breakpoint (up to 640px) */
    @media (max-width: 640px) {
      body {
        padding: 10px;
      }
      .main-wrapper {
        border-radius: 20px;
        min-height: calc(100vh - 20px);
      }
      header.logo-nav {
        padding: 12px 14px;
        gap: 8px;
      }
      .logo-text {
        font-size: 0.8rem;
        text-align: center;
        letter-spacing: 0.8px;
      }
      nav {
        width: 100%;
        max-width: 100%;
        justify-content: center;
        border-radius: 16px;
        gap: 4px;
        padding: 4px;
      }
      nav a {
        font-size: 0.72rem;
        padding: 5px 10px;
        white-space: nowrap;
      }
      .page-content {
        padding: 16px 14px 84px;
        gap: 18px;
      }
      .page-header-flex {
        flex-direction: column;
        align-items: flex-start;
      }
      .page-title {
        font-size: 2.1rem;
      }
      .page-subtitle {
        font-size: 0.7rem;
      }
      .topics-row {
        flex-direction: column;
        gap: 16px;
      }
      .section-block,
      .image-grid-container {
        width: 100%;
        max-width: 100%;
      }
      .section-heading {
        font-size: 1.4rem;
        white-space: normal;
      }
      .section-heading::after {
        width: 28px;
      }
      .image-grid-container {
        justify-content: center;
        padding: 12px;
        gap: 12px;
        border-radius: 16px;
      }
      .gallery-item {
        width: 100%;
        max-width: 320px;
        height: 195px;
      }
      .chibi-companion {
        right: 10px;
        bottom: 12px;
        transform: scale(0.72);
        transform-origin: bottom right;
      }
      .chibi-avatar-shell { width: 58px; height: 58px; border-radius: 18px; }
      .chibi-svg { width: 48px; height: 48px; }
      footer.footer-area {
        padding: 14px;
        flex-direction: column;
        text-align: center;
        font-size: 0.68rem;
      }
    }
  </style>
  <script>
    const rawBaseUrl = "https://raw.githubusercontent.com/alvierowena25/Alvirah-Rowena-Portfolio/main";

    const portfolioGroups = [
      {
        group: "01 / Cover Page Slides",
        topics: [
          {
            title: "Portfolio Cover Slide",
            containerId: "grid-por-slide",
            files: ["https://drive.google.com/thumbnail?id=163H9svy7raPnFguus1uIizGbJ-7y1H10&sz=w1200"]
          },
          {
            title: "Program Cover Slide",
            containerId: "grid-prg-slide",
            files: ["https://drive.google.com/thumbnail?id=1g-MKNNOcKT_sIEkREOKuPZcsLkvxufTy&sz=w1200"]
          },
          {
            title: "Celebration Cover Slide",
            containerId: "grid-cel-slide",
            files: ["https://drive.google.com/thumbnail?id=1jficigPWocYdA22tVGnB25oDzIhJyhhN&sz=w1200"]
          }
        ]
      },
      {
        group: "02 / Project & 3D Works",
        topics: [
          {
            title: "Animations",
            containerId: "grid-anim",
            files: ["https://drive.google.com/thumbnail?id=14r0clfrwJCslHUx_rYiMzBDEut-0QEJi&sz=w1200"]
          },
          {
            title: "IoT Smart Chili Plant",
            containerId: "grid-iot-post",
            files: [
              "https://drive.google.com/thumbnail?id=1Fldtv4kXnOKVw3pgJiRVtTWUlf5rXbZc&sz=w1200",
              "https://drive.google.com/thumbnail?id=1_5_jxWD2B0ZSSYksajy8fXdWezYrV-8G&sz=w1200"
            ]
          }
        ]
      },
      {
        group: "03 / Event & Community Posters",
        topics: [
          {
            title: "Merchandise Posters",
            containerId: "grid-mer-post",
            files: [
              "https://drive.google.com/thumbnail?id=1QtOp_ZG-niPHOxcGtaioamCyPdrRV9xW&sz=w1200",
              "https://drive.google.com/thumbnail?id=19BRY3crrcTE6BgEVP_XMgyRV6D2MK1R0&sz=w1200"
            ]
          },
          {
            title: "Syabas & Tahniah Posters",
            containerId: "grid-sya-post",
            files: [
              "https://drive.google.com/thumbnail?id=1dPHlLCfj1ugUyBvP8E2NtB6PSZRCLRcp&sz=w1200",
              "https://drive.google.com/thumbnail?id=1UoAo8Ep2PeMTZBj0D8ZhbrTK5-kfnYQE&sz=w1200"
            ]
          },
          {
            title: "Program Posters",
            containerId: "grid-prg-post",
            files: ["https://drive.google.com/thumbnail?id=18onVyxC3fbVr0lMZVVd2fZtj9YHa52vc&sz=w1200"]
          },
          {
            title: "Celebrations Posters",
            containerId: "grid-cel-post",
            files: ["https://drive.google.com/thumbnail?id=1uB2bvZ-Y_fTUmiQ5AE2TZOnKMxr0sboC&sz=w1200"]
          }
        ]
      }
    ];

    function resolveImageSrc(baseUrl, filename) {
      if (/^https?:\/\//i.test(filename)) {
        return filename;
      }
      return `${baseUrl}/${filename}`;
    }

    function createTopicBlock(topic) {
      const block = document.createElement("div");
      block.className = "section-block";

      const heading = document.createElement("h2");
      heading.className = "section-heading";
      heading.textContent = topic.title;

      const grid = document.createElement("div");
      grid.className = "image-grid-container";
      grid.id = topic.containerId;

      block.appendChild(heading);
      block.appendChild(grid);
      return block;
    }

    function buildPortfolioSections() {
      const content = document.getElementById("portfolioSections");
      if (!content) return;
      content.innerHTML = "";

      portfolioGroups.forEach((grp) => {
        const groupTitle = document.createElement("div");
        groupTitle.className = "group-label";
        groupTitle.textContent = grp.group;
        content.appendChild(groupTitle);

        const rowEl = document.createElement("div");
        rowEl.className = "topics-row";

        grp.topics.forEach((topic) => {
          rowEl.appendChild(createTopicBlock(topic));
        });

        content.appendChild(rowEl);

        grp.topics.forEach((topic) => {
          renderFullGrid(topic.containerId, rawBaseUrl, topic.files);
        });
      });
    }

    function renderFullGrid(containerId, baseUrl, imageArray) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = "";

      if (!Array.isArray(imageArray) || imageArray.length === 0) {
        container.innerHTML = '<div style="font-size:0.75rem; color:var(--text-muted); font-family:\'JetBrains Mono\',monospace; padding: 10px;">No images available</div>';
        return;
      }

      imageArray.forEach((filename) => {
        const itemDiv = document.createElement("div");
        itemDiv.className = "gallery-item";

        const img = document.createElement("img");
        img.src = resolveImageSrc(baseUrl, filename);
        img.alt = filename.split("/").pop();
        img.loading = "lazy";
        img.onclick = () => openModal(img.src);
        img.onerror = () => {
          itemDiv.style.display = "flex";
          itemDiv.style.alignItems = "center";
          itemDiv.style.justifyContent = "center";
          itemDiv.style.padding = "8px";
          itemDiv.style.fontSize = "0.65rem";
          itemDiv.style.fontFamily = "'JetBrains Mono', monospace";
          itemDiv.style.textAlign = "center";
          itemDiv.style.wordBreak = "break-all";
          itemDiv.textContent = `Missing: ${filename}`;
        };

        itemDiv.appendChild(img);
        container.appendChild(itemDiv);
      });
    }

    function openModal(imgSrc) {
      const modal = document.getElementById("imageModal");
      const modalImg = document.getElementById("modalImg");
      modalImg.src = imgSrc;
      modal.style.display = "flex";
    }

    function closeModal() {
      document.getElementById("imageModal").style.display = "none";
      document.getElementById("modalImg").src = "";
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    window.onload = function() {
      buildPortfolioSections();

      const chibi = document.getElementById("chibiCompanion");
      const chibiBubble = document.getElementById("chibiBubble");
      const chibiLines = [
        "Hi! Tap me ✨",
        "Tap any poster to zoom!",
        "3D renders & posters inside",
        "Designed by Alvirah"
      ];
      let chibiIndex = 0;

      function cycleChibiLine() {
        chibiIndex = (chibiIndex + 1) % chibiLines.length;
        chibiBubble.textContent = chibiLines[chibiIndex];
      }

      if (chibi && chibiBubble) {
        chibi.addEventListener("click", cycleChibiLine);
        chibi.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            cycleChibiLine();
          }
        });
      }
    };
  </script>
</head>
